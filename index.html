<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Land Listing Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Land Listing Mapper</h1>
      <p class="subtitle">Unified land listings with acreage-scaled footprint overlays.</p>
    </div>
    <div class="meta" id="metaLine">Loading listings...</div>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="card">
        <h2>Filters</h2>
        <label>
          Search
          <input id="searchInput" type="search" placeholder="City, state, source, title" />
        </label>
        <label>
          Source
          <select id="sourceFilter">
            <option value="all">All sources</option>
          </select>
        </label>
        <div class="row2">
          <label>
            Min acres
            <input id="minAcres" type="number" min="0" step="0.1" value="1" />
          </label>
          <label>
            Max acres
            <input id="maxAcres" type="number" min="0" step="0.1" value="999999" />
          </label>
        </div>
        <label>
          Footprint shape
          <select id="shapeMode">
            <option value="circle">Circle</option>
            <option value="square">Square</option>
          </select>
        </label>
        <button id="fitBtn" class="btn">Fit To Visible Listings</button>
      </section>

      <section class="card listCard">
        <h2>Listings</h2>
        <p class="hint" id="resultCount">0 listings</p>
        <ul id="listingList"></ul>
      </section>
    </aside>

    <section class="mapWrap">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
